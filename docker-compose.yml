services:
  db:
    image: postgres:16
    environment:
      # Odoo creates and drops databases itself, so it connects as this role.
      # POSTGRES_USER is created as a superuser, which implies CREATEDB.
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      # Odoo connects to the maintenance database "postgres" to list/create DBs.
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -d is required: pg_isready would otherwise probe a database named
      # after the user, which does not exist, and log FATAL on every check.
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        # Without this, Odoo starts faster than Postgres and dies on first connect.
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      # Filestore (attachments, images) lives on disk, not in Postgres.
      - odoo-data:/var/lib/odoo
      # Our configuration replaces the one generated by the image entrypoint.
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      # Only the module itself is mounted, so no repository files leak
      # into the addons path.
      - ./room_reservation:/mnt/extra-addons/room_reservation

volumes:
  db-data:
  odoo-data:
