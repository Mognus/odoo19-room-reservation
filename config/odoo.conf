[options]
; Development configuration only. Never reuse these credentials in production.
admin_passwd = dev

; Database connection. Host "db" is the compose service name.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Our module is mounted here by docker-compose.
addons_path = /mnt/extra-addons

; Filestore location, backed by a named volume.
data_dir = /var/lib/odoo

; Reload Python on change and re-read XML views on every request,
; so editing the module does not require a container restart.
dev_mode = reload,qweb,xml

log_level = info
